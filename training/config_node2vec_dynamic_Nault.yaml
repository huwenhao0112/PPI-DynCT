# =============================================================================
# config_node2vec_dynamic_Nault.yaml
# =============================================================================
# Node2Vec + Dynamic Cell-type Embedding for Nault dataset
# =============================================================================

project_dir: "/root/autodl-tmp/Cell-Type-Specific-Graphs-main"
data_path: "Data/"
dataset_h5ad: "Nault_processed.h5ad"
graphs_path: "graphs/"
graphs_data: "Nault"
SMILES_feat: "SMILES_feat_all_datasets.csv"

save_path_results: "Results/"
save_path_models: "model_checkpoints/"

params:
  hidden_channels: 64
  weight_decay: 0.00001
  in_head: 4
  learning_rate: -3
  num_epochs: 200
  batch_size: 256

# Nault dataset: liver cell types with TCDD perturbation
testing_cell_type: ['Hepatocytes - portal']
testing_drugs: ['TCDD']
multi_pert: false   # Nault has single perturbation condition

seed: 42

# =============================================================================
# Node2Vec Configuration
# =============================================================================
node2vec:
  dim: 64
  mode: both             # global | local | both
  normalize: zscore      # zscore | minmax | none
  walk_length: 40
  context_size: 20
  walks_per_node: 10
  p: 1.0
  q: 1.0
  num_epochs: 10
  lr: 0.01
  batch_size: 256
  ppi_dir: Data/PPI_data_v2/Nault
  use_expr_stats: true

# =============================================================================
# Dynamic Cell-type Embedding Configuration
# =============================================================================
dynamic_celltype:
  dynamic_scale_init: 0.3
  pert_dim: 124

# =============================================================================
# Readout Configuration
# =============================================================================
readout:
  mode: stat        # max | stat | residual_stat
  dropout: 0.0

# =============================================================================
# PPI Configuration
# =============================================================================
ppi:
  enabled: false
  string_links_path: "9606.protein.links.v11.5.txt"
  string_info_path: "9606.protein.info.v11.5.txt"
  string_alias_path: "9606.protein.aliases.v11.5.txt"
  species_prefix: "9606."
  source: "string"
  min_score: 400
  top_quantile: 0.95
  fusion_entropy_beta: 0.05

# =============================================================================
# Model Variant
# =============================================================================
# dynamic_single_n2v       → Single-branch GNN + Node2Vec + Dynamic
# dynamic_dual_n2v         → Dual-branch GNN + Node2Vec + Dynamic (recommended)
# dynamic_dual_n2v_global  → Dual-branch (global fusion) + Node2Vec + Dynamic
# dynamic_dual_n2v_concat  → Dual-branch (concat fusion) + Node2Vec + Dynamic
# =============================================================================
model_variant: "dynamic_dual_n2v"
